        const channelListContainer = document.getElementById('channelListContainer');
        const searchInput = document.getElementById('searchInput');
        let currentPlayer = null;
        let groups = [];
        let activeGroup = -1;
        let activeServer = 0;

        // شطب الأقواس اللي في آخر اسم القناة بعد مسافة
        const TRAIL_RE = /(?:\s+\([^()]*\))+\s*$/;
        function cleanName(n) { return n.replace(TRAIL_RE, "").replace(/\s+/g, " ").trim(); }
        function getTags(n) {
            const tags = [], tm = n.match(TRAIL_RE);
            if (!tm) return tags;
            const re = /\s+\(([^()]*)\)/g; let m;
            while ((m = re.exec(tm[0])) !== null) {
                const t = m[1].trim();
                if (!t) continue;
                tags.push({ text: t, isNum: /^(s|sn)\d+$/i.test(t) });
            }
            return tags;
        }

        // تجميع القنوات (نفس الاسم بعد شطب الأقواس + نفس القسم)
        function buildGroups() {
            groups = [];
            for (const [category, list] of Object.entries(channelsData)) {
                const map = {};
                list.forEach(ch => {
                    const key = cleanName(ch.name).toLowerCase();
                    if (map[key] !== undefined) {
                        groups[map[key]].servers.push(ch);
                    } else {
                        groups.push({ cat: category, name: cleanName(ch.name), servers: [ch] });
                        map[key] = groups.length - 1;
                    }
                });
            }
        }

        function renderChannels(filter = "") {
            channelListContainer.innerHTML = '';
            const f = filter.toLowerCase();

            for (const category of Object.keys(channelsData)) {
                const items = [];
                groups.forEach((g, i) => {
                    if (g.cat !== category) return;
                    if (f === "" || g.servers.some(s => s.name.toLowerCase().includes(f))) items.push(i);
                });
                if (items.length === 0) continue;

                const catDiv = document.createElement('div');
                catDiv.className = 'mb-6';
                catDiv.innerHTML = `<h3 class="w-full text-center text-white text-sm font-bold bg-transparent border border-slate-700 py-3 px-3 mb-3 rounded-lg shadow-sm">${category}</h3>`;

                const ul = document.createElement('ul');
                ul.className = 'space-y-2.5';

                items.forEach(i => {
                    const g = groups[i];
                    const type = g.servers[0].url.indexOf('.m3u8') !== -1 ? 'HLS' : 'DASH';
                    const bgClass = activeGroup === i ? 'bg-green-600 border-green-500 text-white' : 'bg-[#1e1e1e] border-transparent text-gray-200 hover:bg-slate-800';

                    const li = document.createElement('li');
                    li.innerHTML = `
                        <button onclick="playGroup(${i}, 0)"
                            class="w-full text-right px-4 py-3.5 text-sm rounded-lg transition border flex justify-between items-center group ${bgClass}">
                            <span class="font-bold">${g.name}</span>
                            <span class="text-[10px] font-bold bg-[#292929] px-2 py-1 rounded shadow-sm text-gray-400 font-mono tracking-wider ml-1">${type}</span>
                        </button>
                    `;
                    ul.appendChild(li);
                });

                catDiv.appendChild(ul);
                channelListContainer.appendChild(catDiv);
            }
        }

        function playGroup(gi, si) {
            activeGroup = gi;
            activeServer = si;
            renderChannels(searchInput.value);
            playChannel(groups[gi].servers[si]);
        }

        // أزرار السيرفرات داخل حاوية البلاير (تشتغل في الشاشة الكاملة وتختفي مع أزرار التحكم)
        function buildServerBar() {
            const g = groups[activeGroup];
            const container = currentPlayer.getContainer();
            container.querySelectorAll('.server-bar').forEach(el => el.remove());

            const extra = getTags(g.servers[0].name).filter(t => !t.isNum).length;
            if (g.servers.length < 2 && extra === 0) return;

            const bar = document.createElement('div');
            bar.className = 'server-bar';
            const icon = '<svg viewBox="0 0 24 24"><path d="M4 4h16a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zm0 9h16a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-5a1 1 0 0 1 1-1zM6.5 8.5a1 1 0 1 0 0-2 1 1 0 0 0 0 2zm0 9a1 1 0 1 0 0-2 1 1 0 0 0 0 2z"/></svg>';

            g.servers.forEach((srv, s) => {
                const b = document.createElement('button');
                b.className = 'server-btn' + (s === activeServer ? ' active' : '');
                const tags = getTags(srv.name).filter(t => !t.isNum)
                    .map(t => /^(vpn|dvr)$/i.test(t.text) ? t.text.toUpperCase() : t.text);
                const label = 'Server ' + (s + 1) + (tags.length ? ' (' + tags.join(', ') + ')' : '');
                b.innerHTML = icon + '<span>' + label + '</span>';
                b.onclick = function(e) {
                    e.stopPropagation();
                    if (s !== activeServer) playGroup(activeGroup, s);
                };
                bar.appendChild(b);
            });
            container.appendChild(bar);
        }

        function playChannel(ch) {
            document.getElementById('homeScreen').classList.add('hidden');
            document.getElementById('playerContainer').classList.remove('hidden');

            if (currentPlayer) {
                currentPlayer.remove();
                currentPlayer = null;
            }

            const cfg = {
                file: ch.url,
                width: "100%",
                height: "100%",
                autostart: true,
                autoPause: { viewability: false },
                stretching: "uniform"
            };
            if (ch.url.indexOf('.m3u8') !== -1) cfg.type = "hls";
            if (ch.k1 && ch.k2) cfg.drm = { clearkey: { keyId: ch.k1, key: ch.k2 } };

            currentPlayer = jwplayer("jwplayerDiv").setup(cfg);

            currentPlayer.on('ready', function() {
                let isStretched = false;
                const diagonalCutArrow = "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjZmZmIiBzdHJva2Utd2lkdGg9IjIuNSIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIiBzdHJva2UtbGluZWpvaW49InJvdW5kIj48cGF0aCBkPSJNMTQgMTBsNy03bS02IDBoNnY2bS0xMSA1bC03IDdtNiAwSDN2LTYiLz48L3N2Zz4=";

                currentPlayer.addButton(
                    diagonalCutArrow, "توسيع/تضييق الصورة",
                    function() {
                        let videoEl = document.querySelector('.jw-video');
                        if (!isStretched) {
                            currentPlayer.setConfig({ stretching: "exactfit" });
                            if (videoEl) { videoEl.style.objectFit = 'fill'; videoEl.style.width = '100%'; videoEl.style.height = '100%'; }
                            isStretched = true;
                        } else {
                            currentPlayer.setConfig({ stretching: "uniform" });
                            if (videoEl) { videoEl.style.objectFit = 'contain'; }
                            isStretched = false;
                        }
                    }, "stretch-button"
                );

                buildServerBar();
            });

            currentPlayer.on('audioTracks', function() {
                const tracks = currentPlayer.getAudioTracks();
                tracks.forEach((track, index) => {
                    if (track.label.toLowerCase().includes("ara") || track.label.includes("عربي")) {
                        currentPlayer.setCurrentAudioTrack(index);
                    }
                });
            });
        }

        document.getElementById('homeBtn').addEventListener('click', () => {
            if (currentPlayer) { currentPlayer.remove(); currentPlayer = null; }
            activeGroup = -1;
            activeServer = 0;
            renderChannels(searchInput.value);
            document.getElementById('playerContainer').classList.add('hidden');
            document.getElementById('homeScreen').classList.remove('hidden');
        });

        searchInput.addEventListener('input', (e) => renderChannels(e.target.value));
        window.addEventListener("beforeunload", () => { if (currentPlayer) currentPlayer.remove(); });

        buildGroups();
        renderChannels();
    </script>
</body>
</html>
