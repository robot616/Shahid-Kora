            var XHROpen = originalXHR.prototype.open;
            originalXHR.prototype.open = function(method, url) {
                XHROpen.apply(this, arguments);
                this.setRequestHeader('User-Agent', customUA);
            };
        })();

        // قائمة القنوات المحدثة
        const channelsData = {
            "قنوات ثمانية": [
                { id: "thamanya1", name: "ثمانية 1", url: "https://fastlyrwb-live.cdn.intigral-ott.net/bpk-tv/STCT1/wv-pr/manifest.mpd", k1: "714c789c76686632652eefc19f18c3db", k2: "962cee49ee9422b44a6c60a7999854ad" },
                { id: "thamanya2", name: "ثمانية 2", url: "https://fastlyrwb-live.cdn.intigral-ott.net/bpk-tv/STCT2/wv-pr/manifest.mpd", k1: "97e293d59ed72db87f12fe7075d8bb4c", k2: "c633955e4477ed5acbae68a2b0f1d216" },
                { id: "thamanya3", name: "ثمانية 3", url: "https://fastlyrwb-live.cdn.intigral-ott.net/bpk-tv/STCT3/wv-pr/manifest.mpd", k1: "4bc8e4e871589a45e7c0c7d245c243c6", k2: "4c5e8108e0f3cea4b588f5727d3de482" },
            ],
            "شاهد سبورت": [
                { id: "shahid-sports-1", name: "شاهد سبورت 1", url: "https://shahid-sports-1-enc.edgenextcdn.net/out/v1/0169cfa282614ebe97ef0201da87bb04/index.mpd", k1: "ab081a704aad41829b1123b09b6ecafd", k2: "dd51609092fff15e68b91debf5d591f9" },
                { id: "shahid-sports-2", name: "شاهد سبورت 2", url: "https://shahid-sports-2-enc.edgenextcdn.net/out/v1/589aa6b16ce942388695b5b214f4ae93/index.mpd", k1: "50a7f3afc00a40b38face4db639d0e4c", k2: "ad7000691326064706281a700b7d6714" },
                { id: "shahid-sports-3", name: "شاهد سبورت 3", url: "https://live-event-3-enc.edgenextcdn.net/out/v1/1117b28b859948afa6d5660460b392df/index.mpd", k1: "448128e485ef44d98024e7c5f3fa078b", k2: "a5759aeb79afae384819a20c481e2c4a" },
                { id: "shahid-sports-4", name: "شاهد سبورت 4", url: "https://shahid-sports-4-enc.edgenextcdn.net/out/v1/f813ab47644d4c41a99285513f6c7409/index.mpd", k1: "6477160076644679af1028534f03f67e", k2: "1267f99705113a62c7782c4d5281a7eb" },
                { id: "shahid-sports-5", name: "شاهد سبورت 5", url: "https://shahid-sports-5-enc.edgenextcdn.net/out/v1/ae00715d1c2c4432852b44a254c04a3d/index.mpd", k1: "e2df3c205b674360bc6f364ba1090e70", k2: "93da2c77bc812bc05a6e20ad8d35ea78" },
                { id: "shahid-live-event-1", name: "شاهد لايف 1", url: "https://live-event-1-enc.edgenextcdn.net/out/v1/5e6bf6cec93b4d70be12d109cdd43d4c/index.mpd", k1: "487073be27a94a18af3f8c2d17c12bde", k2: "cc668b04c6f99b3afb2188a5fd6a7f97" },
            ]
        };

        const channelListContainer = document.getElementById('channelListContainer');
        const searchInput = document.getElementById('searchInput');
        let currentPlayer = null;
        let activeChannelName = null; // الاعتماد على الاسم بدلاً من المعرف

        function renderChannels(filter = "") {
            channelListContainer.innerHTML = '';
            for (const [category, channels] of Object.entries(channelsData)) {
                const filteredChannels = channels.filter(ch => ch.name.includes(filter));
                if (filteredChannels.length === 0) continue;

                const catDiv = document.createElement('div');
                catDiv.className = 'mb-6';
                
                catDiv.innerHTML = `<h3 class="w-full text-center text-white text-sm font-bold bg-transparent border border-slate-700 py-3 px-3 mb-3 rounded-lg shadow-sm">${category}</h3>`;
                
                const ul = document.createElement('ul');
                ul.className = 'space-y-2.5';
                
                filteredChannels.forEach(ch => {
                    const li = document.createElement('li');
                    const isActive = activeChannelName === ch.name;
                    const bgClass = isActive ? 'bg-green-600 border-green-500 text-white' : 'bg-[#1e1e1e] border-transparent text-gray-200 hover:bg-slate-800';
                    
                    // استخدام ch.name لتمرير الاسم للدالة
                    li.innerHTML = `
                        <button onclick="playChannel('${ch.name}', '${ch.url}', '${ch.k1}', '${ch.k2}')" 
                            class="w-full text-right px-4 py-3.5 text-sm rounded-lg transition border flex justify-between items-center group ${bgClass}">
                            <span class="font-bold">${ch.name}</span>
                            <span class="text-[10px] font-bold bg-[#292929] px-2 py-1 rounded shadow-sm text-gray-400 font-mono tracking-wider ml-1">DASH</span>
                        </button>
                    `;
                    ul.appendChild(li);
                });
                
                catDiv.appendChild(ul);
                channelListContainer.appendChild(catDiv);
            }
        }

        // استقبال الاسم كمتغير أول بدلاً من id
        function playChannel(name, url, k1, k2) {
            activeChannelName = name;
            renderChannels(searchInput.value);

            document.getElementById('homeScreen').classList.add('hidden');
            document.getElementById('playerContainer').classList.remove('hidden');
            
            if (currentPlayer) {
                currentPlayer.remove();
                currentPlayer = null;
            }

            currentPlayer = jwplayer("jwplayerDiv").setup({
                file: url,
                width: "100%",
                height: "100%",
                autostart: true,
                autoPause: { viewability: false },
                stretching: "uniform",
                drm: { clearkey: { keyId: k1, key: k2 } }
            });

            currentPlayer.on('ready', function() {
                let isStretched = false;
                const diagonalCutArrow = "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjZmZmIiBzdHJva2Utd2lkdGg9IjIuNSIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIiBzdHJva2UtbGluZWpvaW49InJvdW5kIj48cGF0aCBkPSJNMTQgMTBsNy03bS02IDBoNnY2bS0xMSA1bC03IDdtNiAwSDN2LTYiLz48L3N2Zz4=";
                
                currentPlayer.addButton(
                    diagonalCutArrow, "توسيع/تضييق الصورة", 
                    function() {
                        let videoEl = document.querySelector('.jw-video');
                        if (!isStretched) { 
                            currentPlayer.setConfig({ stretching: "exactfit" }); 
                            if(videoEl) { videoEl.style.objectFit = 'fill'; videoEl.style.width = '100%'; videoEl.style.height = '100%'; }
                            isStretched = true; 
                        } else { 
                            currentPlayer.setConfig({ stretching: "uniform" }); 
                            if(videoEl) { videoEl.style.objectFit = 'contain'; }
                            isStretched = false; 
                        }
                    }, "stretch-button"
                );
            });
            
            currentPlayer.on('audioTracks', function() {
                const tracks = currentPlayer.getAudioTracks();
                tracks.forEach((track, index) => {
                    if (track.label.toLowerCase().includes("ara") || track.label.includes("عربي")) {
                        currentPlayer.setCurrentAudioTrack(index);
                    }
                });
            });
        }

        document.getElementById('homeBtn').addEventListener('click', () => {
            if (currentPlayer) { currentPlayer.remove(); currentPlayer = null; }
            activeChannelName = null;
            renderChannels(searchInput.value);
            document.getElementById('playerContainer').classList.add('hidden');
            document.getElementById('homeScreen').classList.remove('hidden');
        });

        searchInput.addEventListener('input', (e) => renderChannels(e.target.value));
        window.addEventListener("beforeunload", () => { if(currentPlayer) currentPlayer.remove(); });

        renderChannels();
    </script>
</body>
</html>
